version: 2
updates:
  # Workflow actions are pinned by commit SHA; Dependabot rewrites the SHA and the
  # trailing "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  # Central package management: versions live in Directory.Packages.props at the root.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # Base images in deploy/Dockerfile.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
